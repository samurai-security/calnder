2026-12-31 先負
`.trim().split('\n').map(line=>{
  const [date,rokuyo,...notes]=line.trim().split(/\s+/);
  return [date,{rokuyo,notes:notes.join(' ').split('・').filter(Boolean)}];
}));
const icons={
  '学び運':'./images/timeline_icon_05.png',
  '仕事運':'./images/timeline_icon_01.png',
  '金運':'./images/timeline_icon_06.png',
  '恋愛運':'./images/timeline_icon_02.png',
  '人間関係運':'./images/timeline_icon_03.png',
  '才能運':'./images/timeline_icon_04.png'
};
const forecasts=data.map((row,i)=>{
  const m=row['イベント'].match(/^【([^】]+)】\s*([^\s]+)\s+([\s\S]+)$/);
  return{
    id:'f'+i,
    date:row['日付'],
    kind:m?m[1]:'運勢',
    text:m?m[3]:row['イベント'],
    icon:m?icons[m[1]]:''
  };
});
const events=[
{id:'e0',date:'2026-11-03',kind:'イベント（仮配置）',icon:'❀',label:'縁授祭のご案内',text:'縁授祭で、まねたまとのご縁を深めてみない？ あなたとまねたまの時間を、手元に残すアイテムも用意しているよ。'},
{id:'e1',date:'2026-11-07',kind:'イベント（仮配置）',icon:'▧',label:'託宣壁紙をつくろう',text:'まねたまとの会話から生まれた言葉を、託宣壁紙にして残してみよう。いつものスマホに、まねたまの言葉をそっと添えてね。'}
];
const phone=document.querySelector('.phone');
const calendar=document.querySelector('.calendar');
const overlay=document.querySelector('.overlay');
let mode='有料',week=0,opener=null;
const dateKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const short=d=>(d.getMonth()+1)+'/'+d.getDate();
const plus=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
function close(){
  overlay.hidden=true;
  if(opener&&opener.isConnected)opener.focus();
}
function open(item,button){
  opener=button;
  const d=new Date(item.date+'T12:00:00');
  document.querySelector('#detail-title').textContent=short(d)+'（'+weekdays[d.getDay()]+'） '+item.kind;
  document.querySelector('.detail-text').textContent=item.text;
  overlay.hidden=false;
  document.querySelector('.close').focus();
}
function entry(item){
  const b=document.createElement('button');
  b.className='entry';
  b.type='button';
  b.setAttribute('aria-label',item.kind+'：'+(item.label||item.text)+'。全文を表示');
  const icon=document.createElement('span');
  icon.className='icon'+(item.id.startsWith('f')?' category-icon':'');
  icon.setAttribute('aria-hidden','true');
  if(item.id.startsWith('f')&&item.icon){
    const img=document.createElement('img');
    img.src=item.icon;
    img.alt='';
    img.width=36;
    img.height=36;
    img.decoding='async';
    icon.append(img);
  }else{
    icon.textContent=item.icon||'✦';
  }
  const text=document.createElement('span');
  text.className='snippet';
  text.textContent=Array.from(item.label||item.text).slice(0,10).join('');
  b.append(icon,text);
  b.addEventListener('click',()=>open(item,b));
  return b;
}
function render(){
  close();
  const start=plus(anchor,week*7);
  document.querySelector('.year-select').value=String(start.getFullYear());
  document.querySelector('.mode-select').value=mode;
  calendar.replaceChildren();
  for(let n=0;n<7;n++){
    const d=plus(start,n);
    const key=dateKey(d);
    const dayAlmanac=almanac.get(key);
    const isToday=key===dateKey(anchor);
    const day=document.createElement('div');
    day.className='day'+(isToday?' current':'');
    const date=document.createElement('div');
    date.className='date';
    const number=document.createElement('strong');
    number.textContent=short(d);
    const weekday=document.createElement('span');
    weekday.textContent=weekdays[d.getDay()]+'曜日';
    date.append(number,weekday);
    if(dayAlmanac){
      const rokuyo=document.createElement('span');
      rokuyo.className='rokuyo';
      rokuyo.textContent=dayAlmanac.rokuyo;
      date.append(rokuyo);
    }
    if(isToday){
      const mark=document.createElement('em');
      mark.textContent='今日';
      date.append(mark);
    }
    const items=document.createElement('div');
    items.className='items';
    if(dayAlmanac&&dayAlmanac.notes.length){
      const notes=document.createElement('div');
      notes.className='almanac';
      notes.setAttribute('aria-label','暦注：'+dayAlmanac.notes.join('・'));
      dayAlmanac.notes.forEach(note=>{
        const label=document.createElement('span');
        label.textContent=note;
        notes.append(label);
      });
      items.append(notes);
    }
    const visible=(mode==='有料'||(mode==='お試し'&&week===0)
      ?forecasts.filter(f=>f.date===key):[])
      .concat(events.filter(e=>e.date===key));
    visible.forEach(item=>items.append(entry(item)));
    if(!visible.length&&!(dayAlmanac&&dayAlmanac.notes.length)){
      const empty=document.createElement('span');
      empty.className='empty';
      empty.textContent=mode==='無料'||mode==='お試し'?'イベントはありません':'—';
      items.append(empty);
    }
    day.append(date,items);
    calendar.append(day);
  }
}
document.querySelector('.mode-select').addEventListener('change',e=>{
  mode=e.target.value;
  week=0;
  render();
});
document.querySelector('.year-select').addEventListener('change',e=>{
  const targetYear=Number(e.target.value);
  const yearStart=new Date(targetYear,0,1,12);
  const diffDays=Math.round((yearStart-anchor)/86400000);
  week=Math.ceil(diffDays/7);
  render();
});
document.querySelector('[data-prev]').addEventListener('click',()=>{
  week--;
  render();
});
document.querySelector('[data-next]').addEventListener('click',()=>{
  week++;
  render();
});
document.querySelector('[data-today]').addEventListener('click',()=>{
  week=0;
  render();
});
document.querySelector('.close').addEventListener('click',close);
document.querySelector('.scrim').addEventListener('click',close);
phone.addEventListener('keydown',e=>{
  if(e.key==='Escape')close();
  if(!overlay.hidden&&e.key==='Tab'){
    e.preventDefault();
    document.querySelector('.close').focus();
  }
});
let x=0,y=0;
calendar.addEventListener('touchstart',e=>{
  x=e.changedTouches[0].clientX;
  y=e.changedTouches[0].clientY;
},{passive:true});
calendar.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-x;
  const dy=e.changedTouches[0].clientY-y;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4){
    week+=dx<0?1:-1;
    render();
  }
},{passive:true});
render();
})();
</script>
