<style>
*{box-sizing:border-box}
:root{color-scheme:light;--paper:#fff;--ink:#302b29;--muted:#81756c;--line:#e9e4df;--red:#a32c35;--deep-red:#7d2530;--gold:#b79664;--wash:#f9f4f2;--brown:#bd8771}
html{font-family:"Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif}
body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 "Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}
button,select,textarea{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button,select{cursor:pointer}
button:disabled{cursor:default}
.phone{position:relative;isolation:isolate;display:flex;flex-direction:column;width:390px;max-width:100%;height:min(820px,100svh);margin:0 auto;background:var(--paper);overflow:hidden}
.app-content{display:flex;flex:1;flex-direction:column;min-height:0}
header{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;height:66px;padding:6px 15px;border-bottom:1px solid var(--line);background:#fff}
.logo-area{display:flex;align-items:center;min-width:0;height:48px}
.logo-area img{display:block;width:100%;max-width:174px;height:48px;object-fit:contain;object-position:left center}
.logo-fallback{display:none;font:600 12px/1.5 serif;color:var(--deep-red)}
.logo-area img[hidden]+.logo-fallback{display:block}
.year-picker{display:inline-flex;position:relative;align-items:center;justify-self:center;width:100px}
.year-select{appearance:none;width:100%;border:0;background:transparent;padding:6px 0;text-align:center;text-align-last:center;font:500 23px/1.4 "Noto Serif CJK JP",serif;color:#3c3632;outline-offset:3px}
.year-picker:after{content:"";position:absolute;right:-7px;top:40%;width:7px;height:7px;border-right:1.5px solid #8e7564;border-bottom:1.5px solid #8e7564;transform:rotate(45deg);pointer-events:none}
.menu-toggle{display:flex;flex-direction:column;justify-content:center;align-items:center;justify-self:end;gap:5px;width:40px;height:40px;border:1px solid var(--brown);border-radius:7px;background:var(--wash);color:var(--brown)}
.menu-toggle span{display:block;width:23px;height:1px;background:currentColor}
.week{height:53px;flex:none;display:grid;grid-template-columns:54px 1fr 54px;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);background:#fff}
.arrow{height:48px;width:50px;border:0;background:transparent;color:#9b8173;display:flex;align-items:center;justify-content:center}
.arrow:first-child{justify-self:start}.arrow:last-child{justify-self:end}.arrow:hover{color:var(--deep-red)}
.arrow:before{content:"";display:block;width:14px;height:14px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor}
.arrow[data-prev]:before{transform:rotate(135deg)}.arrow[data-next]:before{transform:rotate(-45deg)}
.today{justify-self:center;min-width:90px;height:31px;padding:3px 14px 5px;border:1px solid #eee3d9;background:#f9f6f1;font-size:12px;letter-spacing:.11em;color:var(--deep-red)}
.calendar{flex:1;min-height:0;display:grid;grid-template-rows:repeat(7,minmax(max-content,1fr));overflow-y:auto;touch-action:pan-y;background:#fff}
.day{display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:20px;padding:7px 15px;background:#fff;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.date{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;align-self:stretch;min-width:0;min-height:44px;white-space:nowrap;font-variant-numeric:tabular-nums;padding:0 0 0 2px;border:0;background:transparent;text-align:left}
.date strong{font:600 18px/1.25 "Noto Serif CJK JP",serif;color:#4b4039}
.date span{font-size:12px;line-height:1.5;color:#91867f}
.date em{margin-top:1px;font-size:12px;color:var(--red);font-style:normal;letter-spacing:.06em}
.date:hover strong,.day.current .date strong{color:var(--deep-red)}
.day.current .date:before{content:"";position:absolute;left:-7px;top:30%;height:40%;width:2px;background:var(--gold)}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 8px;min-width:0;align-content:center;padding:4px 0}
.almanac{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:12px;line-height:1.5;color:var(--deep-red)}
.almanac span{white-space:nowrap}
.entry{display:flex;align-items:center;min-width:0;min-height:36px;gap:5px;padding:1px 0;border:0;background:transparent;text-align:left;color:#514b47}
.entry:hover,.entry:focus-visible,.personal-event:hover{color:var(--red)}
.icon{display:inline-flex;flex:none;justify-content:center;align-items:center;width:20px;height:20px;font-size:12px;line-height:1;color:var(--red)}
.category-icon,.category-icon img{width:36px;height:36px}.category-icon img{display:block;object-fit:contain}
.snippet{min-width:0;white-space:normal;overflow-wrap:anywhere;font-size:12px;line-height:1.5;font-weight:400}
.personal-event{grid-column:1/-1;min-width:0;padding:4px 0;border:0;background:transparent;text-align:left;color:var(--ink);font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.empty{align-self:center;grid-column:1/-1;color:#a59b91;font-size:12px}
.overlay{position:absolute;inset:0;z-index:10}.overlay[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(31,24,21,.4);border:0;width:100%;height:100%;padding:0}
.float{position:absolute;top:24%;left:20px;right:20px;max-height:calc(76% - 16px);overflow-y:auto;filter:drop-shadow(0 14px 23px rgba(24,16,12,.16))}
.bubble{position:relative;background:#fff;border-top:3px solid var(--red);padding:20px 21px 24px}
.bubble:after{content:"";position:absolute;right:32px;bottom:-11px;height:22px;width:22px;background:#fff;clip-path:polygon(0 0,100% 0,100% 100%)}
.detail-head{display:flex;align-items:center;gap:8px;margin-bottom:13px;color:var(--deep-red);font-size:12px;font-weight:600;letter-spacing:.06em}
.detail-head span{flex:1}.close{border:0;background:transparent;width:36px;height:36px;font-size:25px;line-height:1;color:var(--deep-red)}
.detail-text{margin:0;font-size:15px;line-height:1.9;overflow-wrap:anywhere;color:#3e3732}
.speaker{display:flex;align-items:flex-end;flex-direction:column;gap:1px;padding:16px 7px 0}
.speaker img{width:75px;height:96px;object-fit:contain}.speaker span{font-size:12px;color:#fff}
.panel{position:absolute;background:var(--wash);max-height:calc(100% - 32px);overflow-y:auto}
.menu-panel{top:16px;right:15px;width:260px;max-width:calc(100% - 30px);padding:12px 22px 25px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.panel-head h2{margin:0;font-size:14px;font-weight:400}.menu-panel .panel-head{justify-content:flex-end;margin-bottom:0}
.menu-panel fieldset{margin:0;padding:0 0 20px;border:0;min-width:0}
.menu-panel legend{font-size:14px;margin-bottom:12px;padding:0}
.plan-option{display:flex;align-items:center;gap:9px;min-height:40px;cursor:pointer;font-size:14px}
.plan-option input{width:16px;height:16px;margin:0;accent-color:var(--deep-red)}
.menu-links{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.menu-link{display:block;text-align:left;min-height:44px;padding:10px 0;border:0;background:transparent;font-size:14px;color:var(--ink);text-decoration:none}
.menu-link[aria-disabled=true]{color:var(--muted);cursor:default}
.editor-panel{top:50%;left:20px;right:20px;transform:translateY(-50%);padding:10px 15px 24px}
.editor-panel .panel-head{margin-bottom:16px}.save{min-width:64px;min-height:32px;padding:3px 12px;border:1px solid var(--brown);border-radius:6px;background:#fff;color:#9c6653;font-size:14px}
.editor-date{display:block;text-align:center;font-size:14px;font-weight:400;margin:0 0 18px}
.schedule-text{display:block;width:100%;height:190px;min-height:90px;max-height:40svh;resize:vertical;border:1px solid #d7cfca;border-radius:0;background:#fff;padding:12px;font-size:16px;line-height:1.7;outline-offset:2px}
.schedule-text::placeholder{color:#91867f}.save-error{margin:8px 0 0;color:var(--deep-red);font-size:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media(max-width:420px){.phone{width:100%;height:100svh}}
@media(max-width:360px){header{gap:8px;padding-left:12px;padding-right:12px}.year-select{font-size:20px}.day{column-gap:12px;padding-left:13px;padding-right:12px}.items{column-gap:6px}}
@media(max-height:740px){.week{height:45px}.arrow{height:42px}.day{padding-top:3px;padding-bottom:3px}.date strong{font-size:16px}.entry{padding:0}.items{gap:0 6px}.float{top:18%;max-height:calc(82% - 16px)}}
</style>

</div>

</main>

{"日付":"2026-11-03","イベント":"【学び運】辛巳 知識が増えるほど、つい得意げになりやすい日。人に教えたくなったらひと呼吸おいて、聞き役にまわるくらいがちょうどいいよ。"},
{"日付":"2026-11-03","イベント":"【金運】辛巳 お金の入りを、素直に喜んで迎え入れられる時期だよ。家計の見直しや副業のアイデア出しなど、稼ぐ側の準備に踏み出してみて。"},

{"日付":"2026-11-04","イベント":"【金運】壬午 お金のことは、欠けも衝突もない状態こそ美しい。割り勘や立て替えはその場ですっきり清算して、次の使い道を前向きに決めよう。"},

{"日付":"2026-11-05","イベント":"【仕事運】癸未 いまは立場を守り立てる余力があるよ。頼まれた仕事にきちんと応えて、上の人の段取りを先回りで支えてみるといいね。"},

{"日付":"2026-11-07","イベント":"【才能運】乙酉 尖った感性は、外へ出してこそ荒さが抜けていくんだ。思いついたことは遠慮せずに発信して、反応をもらいながら磨いていけばいい。"},
{"日付":"2026-11-07","イベント":"【学び運】乙酉 学びは心の寄りどころになるけれど、今日は詰め込みすぎないのがコツ。新しい講座に飛びつくより、手持ちのノートを見返す程度にしておいて。"},
{"日付":"2026-11-08","イベント":"【金運】丙戌 今はお金そのものを育てていける時だよ。眠っている口座や積み立ての設定を洗い出して、増やすための一手を今日のうちに打とう。"},

{"日付":"2026-11-08","イベント":"【仕事運】丙戌 ずしりとくる責任を一つ背負っても、はね返さずに担いでいける日。受けるか迷っていた仕事があるなら、思い切って手を挙げてみては。"},
{"日付":"2026-11-09","イベント":"【金運】丁亥 お金は、得意なことを元手にして実らせるのが今の筋道。趣味の腕前を小さな仕事に変えられないか、具体的に書き出して動き出そう。"},
{"日付":"2026-11-09","イベント":"【恋愛運】丁亥 恋は、壊さずぶつからずに育てる形が美しいもの。相手のペースを尊重しつつ、次に会う約束だけはあなたから取りつけてね。"},
{"日付":"2026-11-09","イベント":"【人間関係運】丁亥 仲間の力は、外にいる誰かだけでなく、自分の内側の底力としても宿っている。人を頼りすぎず、ひとりで片づけられることは黙々と済ませる日にしよう。"},

{"日付":"2026-11-10","イベント":"【人間関係運】戊子 味方の後押しは心強いけれど、今日はほどほどが肝心。人が増えすぎると自分の取り分が細ることもあるから、誘いを広げすぎないでね。"},
{"日付":"2026-11-11","イベント":"【仕事運】己丑 任された持ち場を、自分の力で押し上げられる時。会議では前のほうに座って意見を伝え、チームの方針づくりにしっかり関わってごらん。"},
{"日付":"2026-11-12","イベント":"【学び運】庚寅 似た者同士で教え合う学びは心地いいぶん、偏りも生まれやすいよ。今日は新しく取り入れるのを控えて、覚えたことの抜けを点検しよう。"},
{"日付":"2026-11-12","イベント":"【才能運】庚寅 気力が満ちた今は、才能を実りのために使っていける。描いたもの、書いたものに値をつけて出品するなど、成果に変える一歩を踏んで。"},
{"日付":"2026-11-13","イベント":"【学び運】辛卯 学びを足すほど、気持ちが大きくなりがちなとき。資格の勉強は先へ進むより、間違えた問題の解き直しに時間を使ってみるのがおすすめ。"},

});
document.querySelector('[data-prev]').addEventListener('click',()=>{week--;render();calendar.scrollTop=0;});
document.querySelector('[data-next]').addEventListener('click',()=>{week++;render();calendar.scrollTop=0;});
document.querySelector('[data-today]').addEventListener('click',()=>{week=0;render();calendar.scrollTop=0;});
document.querySelectorAll('[data-dismiss]').forEach(button=>button.addEventListener('click',()=>closeModal()));
phone.addEventListener('keydown',e=>{
  if(!activeOverlay)return;
  if(e.key==='Escape'){e.preventDefault();closeModal();return;}
  if(e.key==='Tab'){
    const controls=Array.from(activeOverlay.querySelector('[role="dialog"]').querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,a[href],select')).filter(el=>el.tabIndex>=0);
    const first=controls[0],last=controls[controls.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});
let x=0,y=0;
calendar.addEventListener('touchstart',e=>{x=e.changedTouches[0].clientX;y=e.changedTouches[0].clientY;},{passive:true});
calendar.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4){week+=dx<0?1:-1;render();calendar.scrollTop=0;}
},{passive:true});
render();
})();
</script>
</body>
</html>
